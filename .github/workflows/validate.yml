name: Validate deployment materials

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline renderer and gate contracts
        run: python3 -m unittest discover -s tests -v
      - name: Check documentation links and snippet syntax
        run: python3 tools/check-docs.py
      - name: Check whitespace
        run: git show --format= --check HEAD

  windows-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test exporter in Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/test-windows-export.ps1
          ./tools/check-docs.ps1
      - name: Test exporter in PowerShell 7
        shell: pwsh
        run: |
          ./tests/test-windows-export.ps1
          ./tools/check-docs.ps1
